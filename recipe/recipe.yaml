schema_version: 1

context:
  version: "26.9.0"

package:
  name: pytest-ansible
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pytest-ansible/pytest_ansible-${{ version }}.tar.gz
  sha256: bede6952305f01e82fa20a35589a023472255b1a75cf2dd9bad0d09ef5b68740

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools_scm >=7.0.5
    - setuptools >=65.3.0
  run:
    - python >=${{ python_min }}
    - ansible-compat >=25.8.2
    - ansible-core >=2.16.14
    - cffi >=1.15.1
    - packaging >=23.2
    - pytest >=6
    - pytest-xdist >=3.8.0
    - typing_extensions >=4.15.0

tests:
  - python:
      imports:
        - pytest_ansible
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: |
    Plugin for pytest to simplify calling ansible modules from tests or fixtures
  homepage: https://pypi.org/project/pytest-ansible/
  repository: https://pypi.org/project/pytest-ansible/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
